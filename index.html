<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goodfoot - Accessible Senior Walking Routes</title>

    <!-- Browser Favicon -->
    <link rel="icon" type="image/png" href="Goodfoot Logo.png">
    <!-- Smartphone Home Screen Icon -->
    <link rel="apple-touch-icon" href="Goodfoot Logo.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4a5d3e;        /* Olive Green */
            --primary-dark: #3b4a31;
            --primary-light: #eef2ec;
            --accent: #e67e22;         /* Vibrant Orange Highlight */
            --accent-hover: #d35400;
            --card-bg: #ffffff;
            --bg-body: #f4f6f3;
            --text-main: #111111;       /* Deep Black Text */
            --text-muted: #444444;
            --border: #d1d8ce;
            --base-font: 16px;
        }

        body.dark-mode {
            --primary: #5c744d;
            --primary-dark: #2c3825;
            --primary-light: #1e261a;
            --accent: #f39c12;
            --card-bg: #1e1e1e;
            --bg-body: #121212;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --border: #333333;
        }

        html {
            font-size: var(--base-font);
        }
        html.font-large { --base-font: 19px; }
        html.font-xlarge { --base-font: 22px; }

        html, body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            position: relative;
        }

        /* Map Container */
        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Center Map Picker Reticle & Confirmation Banner */
        #map-picker-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1500;
            pointer-events: none;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .map-reticle {
            font-size: 2.5rem;
            color: var(--accent);
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        .map-picker-banner {
            position: absolute;
            top: 20px;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold;
            display: flex;
            gap: 15px;
            align-items: center;
            pointer-events: auto;
            z-index: 1600;
        }

        /* Sidebar Desktop Layout */
        .sidebar {
            position: relative;
            width: 420px;
            min-width: 420px;
            height: 100%;
            background: var(--card-bg);
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .mobile-drag-handle {
            display: none;
            width: 100%;
            padding: 10px 0 4px 0;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background: var(--primary);
            border-radius: 16px 16px 0 0;
        }

        .drag-pill {
            width: 45px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent);
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }

        .header-logo-img {
            height: 34px;
            width: 34px;
            object-fit: contain;
            border-radius: 6px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .accessibility-controls {
            display: flex;
            gap: 3px;
            background: rgba(255,255,255,0.2);
            padding: 3px;
            border-radius: 6px;
        }

        .accessibility-btn {
            background: transparent;
            border: none;
            color: white;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .accessibility-btn.active {
            background: white;
            color: var(--primary);
        }

        .theme-toggle-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
        }

        .mobile-toggle-btn {
            display: none;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            margin-left: 6px;
        }

        .content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }

        /* Mode Selector Tabs */
        .mode-tabs {
            display: flex;
            background: var(--primary-light);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-weight: 700;
            font-size: 0.95rem;
